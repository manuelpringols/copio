# Application Name
spring.application.name=${SPRING_APPLICATION_NAME}


# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}


# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}


# Server Port
server.port=${SERVER_PORT}


# Abilitare SSL
server.ssl.enabled=true

# Percorso del keystore (assicurati che il file keystore.p12 si trovi nella cartella delle risorse del progetto)
server.ssl.key-store=classpath:keystore.p12

# Password del keystore
server.ssl.key-store-password=Jhonnyxvendetta

# Tipo del keystore (PKCS12 è molto comune)
server.ssl.key-store-type=PKCS12
