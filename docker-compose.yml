version: '3.9'

services:
  postgresql:
    image: bitnami/postgresql:15
   # networks:
     # - copio-net
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD}
    volumes:
      - copioDb:/bitnami/postgresql

  backend:
    build:
      context: ./backend/copio
   # networks:
    #  - copio-net
    ports:
      - "9000:9000"
    depends_on:
      - postgresql
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRESQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${POSTGRESQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRESQL_PASSWORD}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
      SERVER_PORT: ${SERVER_PORT}

  frontend:
    image: copio-fe:1.0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
   # networks:
   #   - copio-net
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  copioDb:

#networks:
#  copio-net:
#    external: true

