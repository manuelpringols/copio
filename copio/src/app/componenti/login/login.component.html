<div class="auth-container">
  <div class="auth-box">
    <h2>Accedi al tuo account Copio</h2>

    <!-- Form di Login -->
    <form *ngIf="!showRegister" (submit)="onSubmit()">
      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
        </div>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Inserisci la tua email" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
        </div>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Inserisci la tua password" required />
      </div>

      <button type="submit" class="auth-btn">
        <i class="fas fa-sign-in-alt"></i> Accedi
      </button>

      <div class="switch-link">
        <p>Non hai un account? <a routerLink="/register">Registrati qui</a></p>
      </div>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </div>
</div>
