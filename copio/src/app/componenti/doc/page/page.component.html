<div class="pagina-div">
  <div class="pagina-doc">
    <div class="docs-container">
      <div class="doc-header">
        <h1>Doc Pages</h1>
      </div>

      <div class="content-container">
        <!-- Side navigation -->
        <div class="sidenav">
          <h3>Altre Pagine</h3>
          <ul>
            <li *ngFor="let g of groups" (click)="navigateToGroup(g.id)">
              {{ g.name }}
            </li>
          </ul>
        </div>

        <!-- Contenuto del documento -->
        <div class="group-content">
          <textarea spellcheck="false" [(ngModel)]="group.content" [style]="{height: '400px'}" (input)="onTextChange()"></textarea>

          <!-- Pulsante salva documento -->
          <button *ngIf="isModified" (click)="saveDocument()">Salva Documento</button>
          <button (click)="goBack()">Torna indietro</button>
        </div>
      </div>
    </div>
  </div>
</div>
