<div class="pagina-div">
  <div class="pagina-doc">
    <div class="docs-container">
      <div class="doc-header">
        <h1>{{ groupName }}</h1>
      </div>
      <button class="go_back" (click)="goBack()">Torna indietro</button>

      <div class="content-container">
        <!-- Side navigation -->
        <div class="sidenav">
          <h3>Altre Pagine</h3>
          <button class="openModalButton" (click)="openModal()">+</button>
          <ul>
            <li *ngFor="let g of pages; index as i" (click)="changePage(i)">
              {{ g.pageTitle }}
            </li>
          </ul>
        </div>

        <!-- Modal -->
        <div *ngIf="isModalOpen" class="modal-overlay">
          <div class="modal">
            <h3>Aggiungi Contenuto</h3>
            <input [(ngModel)]="newTitle" placeholder="Inserisci il Titolo" />
            <button (click)="saveNewContent()">Salva</button>
            <button (click)="closeModal()">Chiudi</button>
          </div>
        </div>

        <!-- Contenuto del documento -->
        <div
          [ngStyle]="{
            width: isFullscreen ? '100%' : '60vw',
          }"
          class="group-content"
          *ngIf="groupName"
        >
          <div class="title-container">
            <ng-container *ngIf="!isEditingTitle; else editMode">
              <h2>{{ page.pageTitle }}</h2>
              <button
                class="edit-button"
                style="background: none; border: none"
                (click)="editTitle()"
                aria-label="Modifica titolo"
              >
                ✏️
              </button>
            </ng-container>

            <ng-template #editMode>
              <div class="edit-container">
                <input
                  [(ngModel)]="editableTitle"
                  class="title-input"
                  placeholder="Modifica titolo"
                />
                <button class="save-button" (click)="saveTitle()">💾</button>
                <button class="cancel-button" (click)="cancelEdit()">❌</button>
              </div>
            </ng-template>
          </div>

          <div *ngIf="isModified" class="textarea-container">
            <textarea
              #codeTextArea
              spellcheck="false"
              [(ngModel)]="page.content"
              style="height: 400px; width: 100%"
              (input)="onTextChange()"
            ></textarea>
          </div>

          <!-- Anteprima Markdown -->
          <div class="preview-container">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
              "
            >
              <h3 style="margin: 0">Preview</h3>
              <button (click)="toggleFullscreen()" style="font-size: 1.1em">
                {{ isFullscreen ? 'Riduci Preview' : 'Espandi Preview' }}
                {{ isFullscreen ? '🔽' : '🔼' }}
              </button>
            </div>

            <markdown [data]="codeBlockWrapper(page.content)"></markdown>

            <button (click)="editTextArea()" style="font-size: 1.2em">
              Modifica Preview ✏️
            </button>
          </div>

          <!-- <div class="textarea-container">
            <textarea
              #codeTextArea
              spellcheck="false"
              [(ngModel)]="page.content"
              style="height: 400px;"
              (input)="onTextChange()"
            ></textarea>
          </div> -->
          <!-- <div class="textarea-container">
            <textarea
              #codeTextArea
              spellcheck="false"
              [(ngModel)]="page.content"
              (input)="onTextChange()"
            ></textarea> -->

          <!-- Preview evidenziata
            <div class="markdown-preview">
              <markdown [data]="codeBlockWrapper(page.content)"></markdown>
            </div>
          </div> -->

          <button *ngIf="isModified" (click)="saveDocument()">
            Salva Documento
          </button>
          <button (click)="goBack()">Torna indietro</button>
          <button
            (click)="openConfirmationModal()"
            class="delete-button"
            aria-label="Elimina pagina"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>

        <div *ngIf="isConfirmationModalOpen" class="modal-confirmation">
          <div class="modal-confirmation-content">
            <h3>Sei sicuro di voler eliminare questa pagina?</h3>
            <button (click)="deletePage(pageId)">Elimina</button>
            <button (click)="closeConfirmModal()">Annulla</button>
          </div>
        </div>
      </div>

      <!-- <div
          class="preview-container"
          style="
            flex: 1;
            background: #2d2d2d;
            color: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-y: auto;
            max-height: 80vh;
            font-family: 'Source Code Pro', monospace;
          "
        >
          <h3>Preview</h3>
          <markdown [data]="codeBlockWrapper(page.content)"></markdown>
        </div> -->
    </div>
  </div>
</div>
