<div class="pagina-doc">
  <div class="doc-header">
    <h1>Gruppi Documentazione</h1>

  </div>
  <button (click)="goBack()">Torna indietro</button>

  <!-- Modale Aggiungi Gruppo -->
  <div class="modal" [ngClass]="{'show': isModalVisible}">
    <div class="modal-content">
      <!-- X per chiudere la modale -->
      <span class="close" (click)="closeModal()">&times;</span>
      <h2>Aggiungi Gruppo</h2>
      <form (ngSubmit)="submitGroup()">
        <label for="groupName">Nome Gruppo:</label>
        <input type="text" id="groupName" [(ngModel)]="newGroupName" name="groupName" placeholder="Inserisci nome gruppo" required />
        <button type="submit">Aggiungi</button>
      </form>
    </div>
  </div>

  <div *ngIf="isDeleteModalVisible" class="custom-modal" >
    <div class="custom-modal-content">
      <span class="custom-close" (click)="closeDeleteModal()">&times;</span>
      <h2>Sei sicuro di voler eliminare il gruppo "{{groupToDelete?.title}}"?</h2>
      <button (click)="deleteGroup()">Conferma</button>
      <button (click)="closeDeleteModal()">Annulla</button>
    </div>
  </div>

  <div class="addGroup" (click)="addGroup()">+</div>

  <div class="group-list">
    <div *ngFor="let group of groups; index as i" class="group-item; "  >
      <h3 (click)="selectGroup(group)">{{ group.title }}</h3>
      <span class="close-btn" (click)="openDeleteModal(i); $event.stopPropagation()">&#10005;</span> <!-- La X -->
    </div>
  </div>

</div>
